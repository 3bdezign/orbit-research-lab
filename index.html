(function(root){

};

function validateResult(value,pockets,unknown=true){
 if(value===null || value==='?') { if(unknown)return null; throw Error('A known result is required.'); }

}
function parseHistory(text,pockets,direction='newest') {
 if(typeof text!=='string'||!text.trim())throw Error('Enter at least one result. Use ? for an unreadable result.');
 let raw;
 if(text.trim().startsWith('[')){try{raw=JSON.parse(text);}catch{throw Error('The JSON array is not valid.');}if(!Array.isArray(raw))throw Error('Use an array of results.');}
 else raw=text.trim().split(/[\s,;|]+/).filter(Boolean);
 if(raw.length>10000)throw Error('Import up to 10,000 results per batch.');

}
function overlaps(oldValues,newValues,min=4){
 const candidates=[];
 for(let k=min;k<=Math.min(oldValues.length,newValues.length);k++){
  if(newValues.slice(0,k).every((v,i)=>v!==null&&oldValues[oldValues.length-k+i]!==null&&v===oldValues[oldValues.length-k+i])) candidates.push(k);
 }

}

 if(newValues.length<4||newValues.some(v=>v===null))return false;

}
function stats(values){
 const a=values.filter(v=>Number.isFinite(v));const n=a.length;if(!n)return {n:0,mean:null,median:null,sd:null,cv:null,min:null,max:null};

function uniformTest(values,pockets){const k=Number(pockets),n=values.length,counts=Object.fromEntries(allowed(pockets).map(v=>[v,0]));values.forEach(v=>{if(Object.hasOwn(counts,v))counts[v]++;});if(!n)return {n,counts,expected:0,chi:null,p:null,df:k-1};const expected=n/k,chi=Object.values(counts).reduce((s,o)=>s+(o-expected)**2/expected,0);return {n,counts,expected,chi,p:expected>=5?gammaQ((k-1)/2,chi/2):null,df:k-1};}

function validateTiming(events){
 if(!events||typeof events!=='object'||!Number.isFinite(events.launch)||!Number.isFinite(events.rimExit))throw Error('Mark launch and rim exit first.');

function summarizeSpins(rows,pockets,layout=ORDERS[String(pockets)]){

 const values=rows.filter(usable).map(r=>r.value),test=uniformTest(values,pockets);

function csv(rows,headers){const cell=v=>{let s=v==null?'':String(v);if(/^[\s]*[=+@-]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';};return '\uFEFF'+[headers.map(cell).join(','),...rows.map(r=>headers.map(h=>cell(r[h])).join(','))].join('\r\n');}

function validateBackup(s){

 const ids=new Set();for(const key of collections){const local=new Set();for(const x of s[key]){if(!x||typeof x.id!=='string'||local.has(x.id))throw Error('Invalid or duplicate '+key+' ID.');local.add(x.id);}}

 <section class="card mt"><h2>Method notes & limitations</h2><details class="mt"><summary>What this version measures - and what it does not</summary><p>Launch-to-rim-exit duration, optional settling/display intervals, full-revolution crossings, user-annotated rim-exit sectors, and manually verified outcome sequences are measured or recorded. A timer by itself does not reveal launch velocity, wheel tilt, hidden controller settings, or the next outcome. A screenshot contains past results, not the ball trajectory.</p><p>The app does not automatically transcribe photos, track the ball in video, detect maintenance, measure phone tilt, or infer a casino machine\'s configuration. Video markers and uploaded photos require manual review.</p></details><details class="mt"><summary>Sample sizes, intervals, and selection bias</summary><p>Frequencies are computed from reviewed, known, nonexcluded results. The uniformity check uses Pearson chi-square against 37 or 38 equiprobable pockets, with df = pockets - 1. A Wilson 95% interval is descriptive for a chosen sector and is not corrected for selecting sectors after seeing the data. Many overlapping sector searches can generate apparent findings by chance.</p><p>Sequence metrics use only consecutive verified records in the same session and segment. Green breaks color runs; unknown, excluded, unverified, and disconnected records break all transitions. Session comparisons show sample standard deviation and coefficient of variation; they do not attribute cause.</p><p>Hypothesis protocols lock a sector, target, and empty session. User collection must actually be prospective; file upload date is not observation date. The first target number of reviewed outcomes is summarized, with no automated declaration of bias or betting value.</p></details><details class="mt"><summary>Opening, installing, and moving this site</summary><p>The standalone HTML runs without a build process in a modern full browser. Some phone file-preview apps do not run JavaScript. For convenient phone access, host the included static-site package over HTTPS. Its service worker can cache the app after a first successful load. That cache is not a data backup.</p><p>Records belong to the browser and origin where they were created. Before switching from a local file to a hosted address, export a JSON backup and restore it at the new address. Automatic cross-device sync is not included.</p></details><p class="help mt">Primary sources checked October 17, 2026. Site-specific permission and exact generator model remain unverified. This notebook is not legal advice.</p></section>`;}

reate session')}</form>`);}
async function createSession(input){const m=state.machines.find(x=>x.id===input.machineId);if(!m)throw Error('Choose existing equipment.');if(!input.name?.trim())throw Error('Enter a session name.');if(!['offline','controlled','authorized'].includes(input.mode))throw Error('Choose the collection setting.');if(!input.permissionConfirmed)throw Error('Confirm that your observation setting is permitted.');if(!checkSwitch())throw Error('Session switch cancelled.');const s={id:C.uid(),machineId:m.id,name:input.name.trim().slice(0,120),observedDate:input.observedDate||'',mode:input.mode,anchor:input.anchor||'',notes:input.notes||'',permissionConfirmed:true,closed:false,createdAt:C.now(),timeZone:Intl.DateTimeFormat().resolvedOptions().timeZone};state.sessions.push(s);state.activeSessionId=s.id;formMemory={};activePhoto=null;await commit();render();return s;}

pe="checkbox" ${m?.orderVerified?'checked':''}><span>I verified this pocket order against the actual wheel or its model documentation.</span></label>${modalFoot('Save equipment')}</form>`);}
function saveDraft(){if(demo)return;try{if(timer.start!==null)localStorage.setItem('orbit-timer-draft-v1',JSON.stringify({wall:timer.wall,sessionId:timer.sessionId,events:timer.events,interrupted:true}));else localStorage.removeItem('orbit-timer-draft-v1');}catch{}}
function resetTimer(ask=true){if(ask&&timer.start!==null&&!confirm('Discard the unsaved timing draft?'))return;timer={start:null,wall:null,events:{},interrupted:false};saveDraft();updateTimer();}
function timerNext(){if(timer.recovered)throw Error('This recovered observation cannot be continued. Save its captured marks as uncertain or reset it.');const s=requireSession();if(!s)return;if(timer.start===null){timer={start:performance.now(),wall:C.now(),sessionId:s.id,events:{launch:0},interrupted:false};}else{if(timer.sessionId!==s.id)throw Error('Return to the session where this timer started.');const e=timer.events,t=(performance.now()-timer.start)/1000;if(e.rimExit===undefined)e.rimExit=t;else if(e.settled===undefined)e.settled=t;else if(e.posted===undefined)e.posted=t;}saveDraft();updateTimer();}
function updateTimer(){if(view!=='timer'||!$('#timer-time'))return;const e=timer.events,running=timer.start!==null,elapsed=running?(timer.recovered?Math.max(...Object.values(e)):e.posted??(performance.now()-timer.start)/1000):0;$('#timer-time').innerHTML=num(elapsed,2)+'<small>s</small>';const next=!running?'Mark launch':e.rimExit===undefined?'Mark rim exit':e.settled===undefined?'Mark settled':e.posted===undefined?'Result displayed':'All marks captured';$('#timer-next').innerHTML=icon(running?'check':'play')+' '+next;$('#timer-next').disabled=e.posted!==undefined||!!timer.recovered;$('#timer-phase').textContent=!running?'Ready to mark the ball launch.':e.rimExit===undefined?'Tracking outer-rim travel.':e.settled===undefined?'Rim exit captured. Mark settled, or save now.':e.posted===undefined?'Settled captured. Mark result display, or save now.':'Review the observation and save.';let d=e.rimExit!==undefined?C.validateTiming(e):null;$('#timer-track').textContent=d?num(d.track,2)+' s':'\u2014';$('#timer-scatter').textContent=d?.scatter!==null&&d?num(d.scatter,2)+' s':'\u2014';$('#timer-display').textContent=d?.display!==null&&d?num(d.display,2)+' s':'\u2014';$('#timer-save').disabled=e.rimExit===undefined;$('#timer-save-fast').disabled=e.rimExit===undefined;$('#timer-interrupt').classList.toggle('hidden',!timer.interrupted);}
function readTimingFields(prefix){const get=k=>$('#'+prefix+'-'+k)?.value||'',zone=get('zone'),anchor=get('anchor').trim(),unc=get('uncertainty');if(zone!==''&&!anchor)throw Error('A fixed 12 o\'clock landmark is required for an exit-zone observation.');if(unc!==''&&(!Number.isFinite(Number(unc))||Number(unc)<0))throw Error('Uncertainty must be a nonnegative number or blank.');return {ballDirection:get('ball')||'unknown',rotorDirection:get('rotor')||'unknown',outcome:get('outcome')||null,exitZone:zone===''?null:Number(zone),anchor,quality:get('quality')||'uncertain',note:get('note'),uncertainty:unc===''?null:Number(unc)};}
async function recordTiming(input){const s=state.sessions.find(x=>x.id===input.sessionId);if(!s||s.closed)throw Error('An open session is required.');C.validateTiming(input.events);if(input.outcome)C.validateResult(input.outcome,machine(s).pockets,false);if(input.exitZone!==null&&input.exitZone!==undefined&&(!Number.isInteger(input.exitZone)||input.exitZone<0||input.exitZone>11||!input.anchor?.trim()))throw Error('Use a clock sector 0-11 and a defined reference landmark.');if(!['manual','video'].includes(input.source))throw Error('Use manual taps or video timeline as the source.');const r={...input,id:C.uid(),machineId:s.machineId,recordedAt:C.now(),quality:input.interrupted?'uncertain':input.quality||'uncertain'};state.timings.push(r);await commit();render();return r;}
async function saveTimer(){const s=requireSession();if(!s)return;if(timer.sessionId!==s.id)throw Error('The timer belongs to a different session.');const details=readTimingFields('timer');const r=await recordTiming({...details,sessionId:s.id,source:'manual',events:{...timer.events},observationStartedAt:timer.wall,interrupted:timer.interrupted});resetTimer(false);clearFormMemory('timer-');render();toast('Timing saved. No extra spin-log outcome was created.');return r;}

function updateLaps(){if(view!=='laps'||!$('#lap-time'))return;$('#lap-time').innerHTML=num(lap.start===null?0:(performance.now()-lap.start)/1000,2)+'<small>s</small>';$('#lap-next').innerHTML=icon('rotate')+' '+(lap.marks.length?'Next full turn':'First crossing');$('#lap-save').disabled=lap.marks.length<2;const m=lap.marks.length>1?C.lapMetrics(lap.marks):null;$('#lap-count').textContent=m?.rotations||0;$('#lap-period').textContent=m?num(m.period.mean,3)+' s':'\u2014';$('#lap-rpm').textContent=m?num(m.rpm,2):'\u2014';$('#lap-list').innerHTML=m?`<div class="small" style="color:#b6c6aa">Completed periods: ${m.intervals.map(v=>num(v,2)+' s').join(' \u00b7 ')}${lap.interrupted?'<br>Page hidden during this measurement: quality will be uncertain.':''}</div>`:'';}
async function saveLaps(){const s=requireSession();if(!s)return;if(lap.sessionId!==s.id)throw Error('The crossing set belongs to another session.');const ref=$('#lap-ref').value.trim();if(!ref)throw Error('Record the stationary reference landmark.');C.lapMetrics(lap.marks);state.laps.push({id:C.uid(),sessionId:s.id,machineId:s.machineId,marks:[...lap.marks],object:$('#lap-object').value,direction:$('#lap-direction').value,reference:ref,tracked:$('#lap-tracked').value,quality:lap.interrupted?'uncertain':$('#lap-quality').value,interrupted:lap.interrupted,note:$('#lap-note').value,source:'manual',recordedAt:C.now()});await commit();lap={start:null,marks:[],interrupted:false};clearFormMemory('lap-');render();toast('Crossing set saved.');}
function captureVideoPosition(){const v=$('#research-video');if(v){videoTime=v.currentTime||0;videoRate=v.playbackRate;}}
